[project]
name = "predictor-futbol"
version = "0.1.0"
description = "Predicción probabilística de BTTS, córners y 1X2 (herramienta de apoyo a la decisión)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.scripts]
predictor-futbol = "predictor.cli:main"

[tool.setuptools]
packages = ["predictor", "predictor.datos", "predictor.modelos"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
